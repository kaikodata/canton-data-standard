# Build order for the standard's packages: the interface packages and the codec
# library under interfaces/, then the examples and tests that build against
# their compiled DARs.
#
# Every package here depends only on daml-prim/daml-stdlib and on other packages
# in this repo, so a consumer vendors these DARs and nothing else.
packages:
- ./interfaces/canton-data-standard-utils-v1
- ./interfaces/canton-data-standard-datapoint-v1
- ./interfaces/canton-data-standard-quote-v1
- ./interfaces/canton-data-standard-distributor-key-v1
- ./interfaces/canton-data-standard-codecs
- ./examples/datapoint-producer
- ./examples/datapoint-consumer
- ./examples/quote-producer
- ./examples/quote-consumer
- ./examples/switching-distributor-direct
- ./examples/switching-distributor-marketmaker
- ./examples/switching-consumer
- ./examples/distributor-key-producer
- ./examples/distributor-key-consumer
- ./tests
- ./tests-codecs
- ./tests-crypto
