sdk-version: 3.4.11
name: canton-data-standard-tests-crypto
source: daml
version: 0.2.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  - ../interfaces/canton-data-standard-utils-v1/.daml/dist/canton-data-standard-utils-v1-0.2.0.dar
  - ../interfaces/canton-data-standard-distributor-key-v1/.daml/dist/canton-data-standard-distributor-key-v1-0.2.0.dar
  - ../interfaces/canton-data-standard-codecs/.daml/dist/canton-data-standard-codecs-0.2.0.dar
  - ../examples/distributor-key-producer/.daml/dist/distributor-key-producer-example-0.2.0.dar
  - ../examples/distributor-key-consumer/.daml/dist/distributor-key-consumer-example-0.2.0.dar
  - ../tests/.daml/dist/canton-data-standard-tests-0.2.0.dar
build-options:
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
  - --target=2.1
  - -Wno-crypto-text-is-alpha
