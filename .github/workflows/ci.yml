name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The installer fetches the latest dpm release; the SDK the packages
      # build with is pinned in the next step.
      - name: Install dpm
        run: |
          curl -sSL https://get.digitalasset.com/install/install.sh | sh
          echo "$HOME/.dpm/bin" >> "$GITHUB_PATH"

      - name: Install pinned Daml SDK
        run: dpm install 3.4.11

      # `make ci` includes dars-check, which rebuilds from source and proves
      # the committed dars/ are in sync (package-id comparison). The committed
      # DARs are the distribution channel, so no artifact upload is needed.
      - name: Check headers, build, validate, test and verify committed DARs
        run: make ci
